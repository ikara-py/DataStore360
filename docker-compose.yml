services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: DataStore360
      POSTGRES_USER: DataStore360
      POSTGRES_PASSWORD: notroot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:

  postgres_data: